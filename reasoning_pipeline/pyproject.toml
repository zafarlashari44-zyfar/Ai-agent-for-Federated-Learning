[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-reasoning-pipeline"
version = "0.1.0"
description = "Evidence based reasoning pipeline for federated ECG classification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "neurokit2>=0.2.10,<0.3",
    "ollama>=0.6.2,<0.7",
    "scipy>=1.13",
    "torch>=2.2.2,<2.3",
    "wfdb>=4.1,<5.0",
    "scikit-learn>=1.5,<2.0",
    "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "scipy-stubs>=1.13",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "research/detailed_arrhythmia/tests"]
pythonpath = ["src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["reasoning_pipeline"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "matplotlib",
    "matplotlib.*",
    "neurokit2",
    "pandas",
    "sklearn",
    "sklearn.*",
    "wfdb",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reasoning_pipeline.scribe_v2.r_peak_detector"
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
module = "reasoning_pipeline.scribe_v2.morphology_feature_extractor"
disable_error_code = ["arg-type"]
